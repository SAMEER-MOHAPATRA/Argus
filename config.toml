# Argus configuration — the only file you edit.
#
# This is a neutral example profile. It runs as shipped. The "Set up profile"
# form in the Actions tab rewrites it from a few answers; or edit the role
# keywords, feeds, and scoring weights by hand, then commit.
# Keyword matching is case-insensitive substring: "developer" also matches
# "Software Developer II".

[discovery]
# most recent entries read per feed, per run
max_per_feed = 25

# a job is kept when its title or description contains one of these
role_keywords = [
    "software engineer",
    "software developer",
    "backend engineer",
    "frontend engineer",
    "full stack",
    "data analyst",
    "data engineer",
]

# a job is dropped when its title contains one of these
seniority_block = [
    "senior",
    "staff",
    "lead",
    "manager",
    "director",
    "sr.",
    "head of",
    "principal",
    "vp ",
    "vice president",
]

# ---- feeds -------------------------------------------------------------
# `label` is display only (dashboard, daily digest). The parser picks the
# title shape from the URL host: weworkremotely.com, linkedin.com, naukri.com.
# Any other RSS feed works with the plain "<title>" shape.

[[discovery.feeds]]
label = "WWR | Programming"
url = "https://weworkremotely.com/categories/remote-programming-jobs.rss"

[[discovery.feeds]]
label = "WWR | All"
url = "https://weworkremotely.com/remote-jobs.rss"

[[discovery.feeds]]
label = "Himalayas | Remote"
url = "https://himalayas.app/jobs/rss"

# Remotive: .com is Cloudflare-walled and ignores category filters; the .io
# mirror serves the general feed, which role_keywords filters anyway.
[[discovery.feeds]]
label = "Remotive | Remote"
url = "https://remotive.io/remote-jobs/feed"

# LinkedIn has no public RSS. Google News indexes LinkedIn job pages, so a
# news search scoped to the site works as a feed. Change the quoted phrase
# (URL-encoded: %22 is a quote, + is a space) and the country codes
# (hl=en-US&gl=US&ceid=US:en) to match your search.
[[discovery.feeds]]
label = "LinkedIn | Software Engineer"
url = "https://news.google.com/rss/search?q=site%3Alinkedin.com%2Fjobs+%22software+engineer%22&hl=en-US&gl=US&ceid=US:en"

# Naukri (India) works the same way. Delete this feed if you do not want India.
[[discovery.feeds]]
label = "Naukri | Software Engineer"
url = "https://news.google.com/rss/search?q=site%3Anaukri.com+%22software+engineer%22&hl=en-IN&gl=IN&ceid=IN:en"

# RemoteOK RSS is gone upstream (HTTP 410). Do not re-add its .rss URLs.

# ---- scoring -----------------------------------------------------------
# The dashboard ranks stored jobs by points. Freshness is fixed in code
# (<=1 day 50, <=3 days 40, <=7 days 25, <=14 days 10). Everything below is
# yours to tune.

[scoring]
# +skill_point for each skill found in the title, description, or location;
# the total is capped at skill_cap
skills = ["python", "sql", "typescript", "react", "aws", "docker", "git"]
skill_point = 5
skill_cap = 25

# first title keyword that matches wins; order is priority
[scoring.title]
"software engineer" = 30
"software developer" = 30
"backend engineer" = 25
"frontend engineer" = 25
"data analyst" = 20

# first location keyword that matches wins; checked against title,
# description, and location
[scoring.location]
"remote" = 20
"work from anywhere" = 20
"anywhere" = 20
"hybrid" = 5
